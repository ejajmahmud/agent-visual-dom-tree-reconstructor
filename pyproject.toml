[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-visual-dom-tree-reconstructor"
version = "0.1.0"
description = "Visual-to-hierarchical DOM synthesizer generating accessibility tree representations from raw screenshot pixel arrays"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-visual-dom-tree-reconstructor = "agent_visual_dom_tree_reconstructor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_visual_dom_tree_reconstructor*"]
